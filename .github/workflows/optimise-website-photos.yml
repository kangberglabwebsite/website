name: Optimise website photographs

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/optimise-website-photos.yml

permissions:
  contents: write

jobs:
  optimise-photos:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Create optimised images and update references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          # Selected portraits and lab-life photographs only. Do not alter microscopy,
          # scientific figures, logos or other source images.
          photos = [
              'tom.png', 'Image.jpeg', '56460.jpg', '56462.jpg', '56463.jpg',
              '20260227_124634.jpg', 'RiverAberdeen.png',
              'Rickard.jpeg', 'Sara.jpg', 'DH.jpeg', 'lab2.jpeg'
          ]
          replacements = {}
          for name in photos:
              source = Path('img') / name
              if not source.is_file():
                  continue
              target = source.with_suffix('.webp')
              with Image.open(source) as original:
                  if getattr(original, 'is_animated', False):
                      continue
                  im = ImageOps.exif_transpose(original)
                  im.thumbnail((2000, 2000), Image.Resampling.LANCZOS)
                  if im.mode not in ('RGB', 'RGBA'):
                      im = im.convert('RGBA' if 'A' in im.getbands() else 'RGB')
                  im.save(target, 'WEBP', quality=88, method=6)
              if target.stat().st_size >= source.stat().st_size * 0.9:
                  target.unlink()
                  continue
              replacements[name] = target.name
              print(f'{name}: {source.stat().st_size:,} -> {target.stat().st_size:,} bytes')
          for html in list(Path('.').glob('*.html')) + list(Path('ko').glob('*.html')):
              text = html.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace('img/' + old, 'img/' + new)
              if updated != text:
                  html.write_text(updated, encoding='utf-8')
                  print(f'Updated references: {html}')
          PY
      - name: Commit optimised photos
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add img/ *.html ko/*.html
            git commit -m "Optimise website photos as WebP without changing original files"
            git push
          else
            echo "No photos required optimisation"
          fi
